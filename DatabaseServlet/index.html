<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Database Servlet</title>
</head>
<body>
    <h2>Employee Records</h2>
    <!-- method="get" sends a GET request to the servlet mapped at /DatabaseServlet -->
    <form action="DatabaseServlet" method="get">
        <input type="submit" value="Display Records">
    </form>
</body>
</html>
